<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课堂随机点名（无需构建）</title>
  <style>
    :root {
      --bg1: #eff6ff;
      --bg2: #e0e7ff;
      --card: #ffffffee;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
    }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: var(--text);
    }
    .container { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    h1 { text-align: center; font-size: 32px; font-weight: 800; margin: 0 0 24px; letter-spacing: -0.02em; }
    .select-block { margin-bottom: 16px; }
    .label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .select {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #d1d5db; background: #fff;
      outline: none; transition: box-shadow .2s, border-color .2s;
    }
    .select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, .15); }
    .hint { margin-top: 6px; font-size: 12px; color: var(--muted); }

    .card {
      background: var(--card); backdrop-filter: blur(6px);
      border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
    }
    .center { display: flex; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--primary); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700;
      border: none; cursor: pointer; box-shadow: 0 2px 6px rgba(37, 99, 235, .25);
      transition: transform .1s ease, background .2s ease, box-shadow .2s ease;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; box-shadow: none; }
    
    .avatar {
      width: 200px;
      height: 200px;
      object-fit: contain;
      object-position: center;
      display: block;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 6px;
      box-shadow: none;
      transition: none;
    }
    .avatar:hover { transform: none; box-shadow: none; border-color: #e5e7eb; }
    .student-name { text-align: center; font-size: 20px; font-weight: 800; margin-top: 12px; }

    .fade-enter { opacity: 0; }
    .fade-enter-active { opacity: 1; transition: opacity .3s ease; }
  </style>
</head>
<body>
  <div class="container">
    <h1>课堂随机点名</h1>

    <div class="select-block">
      <div style="display:flex; gap:8px; align-items:center; margin-bottom: 12px;">
        <button id="genBtn" class="btn" type="button">📂 选择 images 文件夹</button>
        <input id="dirPicker" type="file" webkitdirectory directory multiple style="display:none;" />
        <span class="hint">系统会自动加载同路径下的images文件夹，也可手动选择</span>
      </div>
      <div id="statusHint" class="hint" style="margin-bottom: 8px; font-weight: 500;">正在检查本地文件...</div>
      <label class="label">请选择班级</label>
      <select id="classSelect" class="select">
        <option value="">请选择班级</option>
      </select>
      <div id="classHint" class="hint"></div>
    </div>

    <div class="card">
      <div class="center" style="margin-bottom: 16px;">
        <button id="pickBtn" class="btn" disabled>
          <span id="btnIdle">🎯 开始点名</span>
          <span id="btnBusy" style="display:none;">🎲 正在抽取...</span>
        </button>
      </div>

      <div id="result" style="text-align:center; min-height: 200px;"></div>
    </div>
  </div>

  <script src="classes.js"></script>
</body>
</html>
