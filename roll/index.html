<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="811lab 课堂随机点名工具">
  <title>课堂随机点名 · 811lab.cn</title>
  <link rel="preconnect" href="https://miaoda.feishu.cn">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap">
  <style>
    :root {
      --paper: #f4f1ea;
      --paper-deep: #e8e3d9;
      --ink: #1b1d1b;
      --muted: #696b66;
      --line: #c9c5bc;
      --orange: #da663f;
      --orange-dark: #b94f2d;
      --teal: #4e8179;
      --blue: #446a86;
      --gold: #c59a4e;
      --white: #fffdf8;
      --mono: "DM Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Space Grotesk", "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: "Noto Serif SC", "Songti SC", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--paper);
      background-size: 48px 48px;
      font-family: var(--sans);
    }

    button,
    select,
    input {
      font: inherit;
    }

    button,
    select {
      letter-spacing: 0;
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(68, 106, 134, 0.32);
      outline-offset: 3px;
    }

    .site-bar {
      border-bottom: 1px solid var(--ink);
      background: rgba(244, 241, 234, 0.96);
    }

    .site-bar-inner {
      width: min(1180px, calc(100% - 40px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border: 1px solid var(--ink);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 5px;
      background: var(--white);
    }

    .brand-mark span {
      background: var(--ink);
    }

    .brand-mark span:nth-child(2) {
      background: var(--orange);
    }

    .brand-mark span:nth-child(3) {
      background: var(--teal);
    }

    .brand-copy {
      display: grid;
      gap: 2px;
    }

    .brand-copy strong {
      font-size: 16px;
      line-height: 1;
    }

    .brand-copy small,
    .back-link {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.4;
    }

    .back-link {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 3px;
    }

    .back-link:hover {
      color: var(--orange-dark);
      border-color: var(--orange-dark);
    }

    .page-shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0 72px;
    }

    .page-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 440px);
      align-items: end;
      gap: 48px;
      margin-bottom: 36px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--orange-dark);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 48px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .heading-note {
      margin: 0;
      padding-left: 18px;
      border-left: 3px solid var(--teal);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .tool-frame {
      display: grid;
      grid-template-columns: minmax(280px, 0.76fr) minmax(360px, 1.24fr);
      min-height: 520px;
      border: 1px solid var(--ink);
      background: var(--white);
      box-shadow: 10px 10px 0 var(--paper-deep);
    }

    .control-panel,
    .result-panel {
      min-width: 0;
      padding: 32px;
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--ink);
      background: var(--paper);
    }

    .panel-index {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
    }

    .panel-index span:last-child {
      color: var(--teal);
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 600;
    }

    .select {
      width: 100%;
      min-height: 48px;
      padding: 0 42px 0 14px;
      color: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 4px;
      background: var(--white);
      cursor: pointer;
    }

    .select:hover {
      border-color: var(--blue);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    #classHint {
      min-height: 40px;
      margin-top: 9px;
    }

    .local-data {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .local-data-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .local-data-head .field-label {
      margin: 0;
    }

    .local-data-head span {
      color: var(--gold);
      font-family: var(--mono);
      font-size: 10px;
    }

    #statusHint {
      min-height: 39px;
      margin: 0 0 14px;
      color: var(--muted) !important;
    }

    .btn {
      min-height: 46px;
      border: 1px solid var(--ink);
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, transform 120ms ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      width: 100%;
      color: var(--ink);
      background: transparent;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-secondary:hover {
      color: var(--white);
      background: var(--ink);
    }

    .privacy-note {
      margin: auto 0 0;
      padding-top: 28px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.7;
    }

    .privacy-note::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      background: var(--teal);
    }

    .result-panel {
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .result-panel::after {
      content: "811";
      position: absolute;
      right: 16px;
      bottom: -28px;
      color: var(--paper-deep);
      font-family: var(--mono);
      font-size: 122px;
      font-weight: 500;
      line-height: 1;
      pointer-events: none;
    }

    .result-panel .panel-index {
      position: relative;
      z-index: 1;
      margin-bottom: 18px;
    }

    .result-stage {
      min-height: 342px;
      flex: 1;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
      padding: 18px 0 24px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    #result {
      width: 100%;
      min-height: 274px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    #result:empty::before {
      content: "等待抽取";
      color: var(--line);
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 600;
    }

    .avatar {
      width: 220px;
      height: 220px;
      display: block;
      margin: 0 auto;
      padding: 7px;
      object-fit: contain;
      object-position: center;
      border: 1px solid var(--ink);
      border-radius: 4px;
      background: var(--white);
      box-shadow: 7px 7px 0 var(--paper-deep);
    }

    .student-name {
      margin-top: 20px;
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
    }

    .fade-enter {
      opacity: 0;
    }

    .fade-enter-active {
      opacity: 1;
      transition: opacity 300ms ease;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-top: 24px;
      position: relative;
      z-index: 1;
    }

    .action-note {
      margin: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.6;
    }

    .btn-primary {
      min-width: 144px;
      padding: 0 20px;
      color: var(--white);
      border-color: var(--orange-dark);
      background: var(--orange);
      font-weight: 700;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--orange-dark);
    }

    .btn-primary:disabled {
      color: #8b8c87;
      border-color: var(--line);
      background: var(--paper-deep);
      cursor: not-allowed;
    }

    @media (max-width: 820px) {
      .page-heading {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      h1 {
        font-size: 40px;
      }

      .tool-frame {
        grid-template-columns: 1fr;
      }

      .control-panel {
        border-right: 0;
        border-bottom: 1px solid var(--ink);
      }

      .privacy-note {
        margin-top: 24px;
      }
    }

    @media (max-width: 540px) {
      .site-bar-inner,
      .page-shell {
        width: min(100% - 24px, 1180px);
      }

      .site-bar-inner {
        min-height: 64px;
      }

      .brand-copy small {
        display: none;
      }

      .page-shell {
        padding: 40px 0 52px;
      }

      h1 {
        font-size: 34px;
      }

      .heading-note {
        font-size: 13px;
      }

      .control-panel,
      .result-panel {
        padding: 24px 18px;
      }

      .panel-index {
        margin-bottom: 24px;
      }

      .result-stage {
        min-height: 330px;
      }

      .avatar {
        width: min(210px, calc(100vw - 88px));
        height: min(210px, calc(100vw - 88px));
      }

      .action-row {
        align-items: stretch;
        flex-direction: column;
      }

      .btn-primary {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-bar">
    <div class="site-bar-inner">
      <a class="brand" href="../" aria-label="返回 811lab.cn 首页">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>811lab.cn</strong><small>个人工作室 / working notes</small></span>
      </a>
      <a class="back-link" href="../">返回工作台</a>
    </div>
  </header>

  <main class="page-shell">
    <section class="page-heading" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">TEMPORARY TOOL / ROLL CALL</p>
        <h1 id="page-title">课堂随机点名</h1>
      </div>
      <p class="heading-note">选择班级后开始随机抽取。连续两次不会抽到同一位同学，也可以临时读取本地名单与照片。</p>
    </section>

    <section class="tool-frame" aria-label="随机点名工具">
      <div class="control-panel">
        <div class="panel-index"><span>01 / 名单设置</span><span>READY</span></div>

        <div class="select-block">
          <label class="field-label" for="classSelect">选择班级</label>
          <select id="classSelect" class="select">
            <option value="">请选择班级</option>
          </select>
          <div id="classHint" class="hint" aria-live="polite"></div>
        </div>

        <div class="local-data">
          <div class="local-data-head">
            <span class="field-label">临时读取本地名单</span>
            <span>OPTIONAL</span>
          </div>
          <div id="statusHint" class="hint" aria-live="polite">正在检查本地文件...</div>
          <button id="genBtn" class="btn btn-secondary" type="button">选择名单文件夹</button>
          <input id="dirPicker" type="file" webkitdirectory directory multiple hidden>
        </div>

        <p class="privacy-note">本地选择的文件只在当前浏览器中处理。</p>
      </div>

      <div class="result-panel">
        <div class="panel-index"><span>02 / 抽取结果</span><span>RANDOM PICK</span></div>
        <div class="result-stage">
          <div id="result" aria-live="polite"></div>
        </div>
        <div class="action-row">
          <p class="action-note">每次等待 0.8 秒<br>自动避开上一次结果</p>
          <button id="pickBtn" class="btn btn-primary" type="button" disabled>
            <span id="btnIdle">开始点名</span>
            <span id="btnBusy" style="display: none;">正在抽取...</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="classes.js"></script>
</body>
</html>
